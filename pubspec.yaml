name: cyphor_vault
description: "CipherBox — Fully offline, zero-knowledge encrypted personal vault."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # File system
  path_provider: ^2.1.4

  # Cryptography (AES-256-GCM + Argon2id)
  pointycastle: ^4.0.0

  # Secure key storage (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^11.0.0

  # Biometric authentication
  local_auth: ^3.0.2

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Google Drive API
  googleapis: ^17.0.0

  # HTTP client
  http: ^1.2.2

  # Image picker (camera + gallery)
  image_picker: ^1.1.2

  # File picker (local backup/restore)
  file_picker: ^12.2.0

  # Navigation
  go_router: ^18.0.1

  # Animations
  flutter_animate: ^4.5.0

  # Share sheet
  share_plus: ^13.3.0

  # App version info
  package_info_plus: ^10.2.1

  # Date/number formatting
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.4.2

  # HMAC / SHA-256
  crypto: ^3.0.5

  # Swipe-to-delete list items
  flutter_slidable: ^4.0.3

  # PIN entry widget
  pin_code_fields: ^9.4.0

  # SVG icons
  flutter_svg: ^2.0.10+1

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # Rich text editor
  flutter_quill: ^11.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

